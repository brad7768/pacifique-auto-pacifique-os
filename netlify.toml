# Déploiement Netlify — Pacifique Auto (Astro)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Clean URL redirects — activer au fur et à mesure que les pages existent.
# Legacy HTML n'est plus publié (conservé dans /legacy du repo uniquement).

[[redirects]]
  from = "/services"
  to = "/solutions"
  status = 302

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
